name: Déploiement Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Assemble worker/site : Astra à la racine, DeepSeek, Fable, Gemini et prompt.
      - name: Assembler le site
        run: node scripts/build-site.mjs

      # Le domaine discover.nsi.xyz est servi par ce Worker (assets statiques).
      # La route discover.nsi.xyz/* est prioritaire sur l'enregistrement *.nsi.xyz.
      - name: Déployer le Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config worker/wrangler.json

      # Même contenu publié aussi sur Cloudflare Pages (environnement de préversion).
      - name: Déployer sur Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy worker/site --project-name=discover-nsi-xyz --branch=main
